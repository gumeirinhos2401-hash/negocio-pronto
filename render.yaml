# Render Blueprint: one web service delivers both the built app (dist) and the API.
# The database is external (Neon or Supabase); paste its connection string as DATABASE_URL.
services:
  - type: web
    name: negocio-pronto
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -w server
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Requests reach the app through three proxies: Cloudflare's edge, Render's internal
      # proxy (10.x) and a loopback proxy (seen in the logs on 2026-10-05). Trusting exactly
      # three hops yields the visitor. Trusting all Cloudflare ranges instead would let anyone
      # spoof the address through a Cloudflare Worker, whose egress is inside those ranges.
      - key: TRUST_PROXY
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
